name: Release backend image

# Builds the backend image for a published release and pushes it to the
# GitHub Container Registry, which is where docker-compose.yml pulls it
# from.
#
# The image is built here rather than on the machine that runs it. A
# release build with full LTO takes the better part of a quarter of an
# hour on a NAS CPU, and Portainer gives a stack deploy a fixed time limit
# that it cannot be told to extend: past it the deploy fails with
# "context deadline exceeded" while the compiler is still at work. Pulling
# a finished image takes seconds.
#
# A separate workflow for the same reason as release-app.yml: a failed
# image build must not touch a release that is otherwise correct, and it
# can be re-run from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.19.2"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/hippocampus-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The tag, not the branch, as in release-app.yml.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: tags
        run: |
          version="${TAG#v}"
          echo "list=${IMAGE}:${version},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # The repository root, as in docker-compose.build.yml: backend is
          # a workspace member and needs its siblings to build.
          context: .
          file: backend/Dockerfile
          # The NAS this runs on is x86_64. An arm64 image would mean
          # compiling the whole backend again under emulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # The source label links the package to this repository, so it
          # shows up on the repository page and follows its visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
