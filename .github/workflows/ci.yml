name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Split from `rust` rather than folded into it: GitHub service
  # containers only exist on Linux runners, and the job above is on macOS
  # because that is what the app is actually built and shipped on. The
  # tests here are the ones whose whole subject is SQL, so a mock pool
  # would assert nothing — see backend/src/routes/graph.rs.
  rust-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hippocampus
          POSTGRES_PASSWORD: hippocampus
          POSTGRES_DB: hippocampus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hippocampus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hippocampus:hippocampus@localhost:5432/hippocampus
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test against a real database
        # `#[sqlx::test]` migrates a fresh database per test itself, so
        # there is no migration step here — only the empty one it clones
        # from has to exist, which the service container provides.
        run: cargo test -p backend --features db-tests

  client:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build --if-present

  release:
    name: Release
    needs: [rust, rust-db, client, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    # Two pushes to main close together used to race here: one release job
    # would check "is main behind?" before the other's push landed and
    # proceed anyway, then lose the push itself with "rejected (fetch
    # first)" once semantic-release/git tried it (seen for real on #31,
    # merged 3 minutes after #30). cancel-in-progress: false queues the
    # second run instead of racing it — it starts only once the first has
    # fully finished, by which point main already has whatever the first
    # one published.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # The default GITHUB_TOKEN authenticates as github-actions[bot], which
      # is not an admin on this repo — main's branch protection requires a
      # PR for anyone else, so the release commit + tag `semantic-release`
      # pushes directly would be rejected. RELEASE_TOKEN is a fine-grained
      # PAT scoped to this repo, issued by the repo owner (an admin, and
      # enforce_admins is off), so a push authenticated with it is exempt —
      # same bypass another-project's CI solves with a dedicated GitHub App;
      # a single-owner personal repo doesn't need that much machinery.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release
