[workspace]
resolver = "3"
# The Tauri client is a separate workspace: its speech model and the
# backend's embedding model pin incompatible exact versions of `ort`.
# See docs/adr/0007-separate-client-workspace.md.
members = ["backend", "contracts"]

[workspace.package]
version = "1.15.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
