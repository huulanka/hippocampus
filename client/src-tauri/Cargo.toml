# Its own workspace, not a member of the repository root's: `transcribe-rs`
# pins ort =2.0.0-rc.12 and the backend's `fastembed` pins =2.0.0-rc.13, and
# a single lock file cannot hold both. See
# docs/adr/0007-separate-client-workspace.md.
[workspace]

[package]
name = "client"
version = "1.15.0"
description = "Hippocampus desktop client (capture + browse)"
authors = ["Andreas Bauer"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
contracts = { version = "1.15.0", path = "../../contracts" }
anyhow = "1"
cpal = "0.18"
hound = "3"
rubato = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# ONNX rather than the whisper-cpp backend: that one builds whisper.cpp
# from source and so would make cmake a hard build dependency for the whole
# workspace, CI included. `ort` ships prebuilt binaries.
transcribe-rs = { version = "0.3", features = ["onnx"] }
iana-time-zone = "0.1"
# The outbox names its entries and stamps them. Both are on disk in files
# the user can read, so they are spelled out here rather than reached
# through `contracts`.
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-notification = "2"

[dev-dependencies]
# `macros` only here: the gated outbox round-trip test needs
# `#[tokio::test]`; the app itself runs on Tauri's own runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
# `v1` is the feature that exposes keyring's actual Entry API (not just
# "pull in extra backends" — the crate won't compile without it). The
# windows/zbus backends it also nominally enables are harmless here: each
# is gated behind its own `[target.'cfg(...)']` in keyring's manifest, so
# only apple-native-keyring-store actually gets compiled on macOS.
keyring = { version = "4", default-features = false, features = ["v1"] }
# LocalAuthentication, for the Touch ID gate in front of the notes
# ([`crate::lock`]). The same objc2 generation as the AVFoundation
# bindings above, so there is one Objective-C bridge in this crate rather
# than two. `tauri-plugin-biometric` is not an option: it exists only for
# Android and iOS.
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["LAContext", "LAError", "LABiometryType", "block2", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSError", "std", "NSDate", "NSArray", "NSPredicate", "NSSet", "NSURL", "NSUserDefaults", "NSObject"] }
# EventKit, for the calendars this Mac is told to watch ([`crate::calendar`]).
# Read-only: nothing here ever writes to a calendar. `objc2-app-kit` only
# for `NSColor`, so the Settings list can show each calendar in its own
# colour — the fastest way to tell "Arbeit" from "Privat" at a glance.
objc2-event-kit = { version = "0.3.2", default-features = false, features = ["EKEventStore", "EKCalendar", "EKEvent", "EKCalendarItem", "EKParticipant", "EKSource", "EKTypes", "EKObject", "block2", "std", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColor", "NSColorSpace", "std"] }
