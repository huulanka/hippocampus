# Its own workspace, not a member of the repository root's: `transcribe-rs`
# pins ort =2.0.0-rc.12 and the backend's `fastembed` pins =2.0.0-rc.13, and
# a single lock file cannot hold both. See
# docs/adr/0007-separate-client-workspace.md.
[workspace]

[package]
name = "client"
version = "0.1.0"
description = "Hippocampus desktop client (capture + browse)"
authors = ["Andreas Bauer"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
contracts = { version = "0.1.0", path = "../../contracts" }
anyhow = "1"
cpal = "0.18"
hound = "3"
rubato = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# ONNX rather than the whisper-cpp backend: that one builds whisper.cpp
# from source and so would make cmake a hard build dependency for the whole
# workspace, CI included. `ort` ships prebuilt binaries.
transcribe-rs = { version = "0.3", features = ["onnx"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
