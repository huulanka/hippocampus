[package]
name = "tauri-plugin-hippocampus-speech"
version = "0.1.0"
description = "Recording and speech recognition on the iPhone, in Swift"
edition = "2021"
publish = false
links = "tauri-plugin-hippocampus-speech"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
