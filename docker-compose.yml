# HIPPOCAMPUS_DATA_DIR: where the bind-mounted volumes below actually live
# on the host. Defaults to ./data (relative to this file), which is fine
# for local dev but not for a Portainer "deploy from Git repository" stack
# — Portainer clones the repo into its own managed stack directory, and
# ./data there is not a place a growing Postgres database, the audio
# archive, or the model cache should sit unattended. Point this at real,
# backed-up NAS storage instead (e.g. /volume1/docker/hippocampus/data on
# a Synology) via the stack's environment variables.
#
# POSTGRES_PASSWORD: the database password. The default is only there so a
# local `docker compose up` works without setup; anything that holds real
# notes sets its own. Postgres reads it only when it creates an empty data
# directory, so changing it later needs an ALTER USER as well (see
# docs/operations.md). The backend builds its DATABASE_URL from it, which
# is why it should stay URL-safe (e.g. `openssl rand -hex 32`).
#
# HIPPOCAMPUS_PUBLISH / HIPPOCAMPUS_DB_PUBLISH: where the backend's and
# Postgres's ports are published on the host. Both default to 127.0.0.1,
# reachable from the machine itself and nowhere else. A backend reached
# through a Cloudflare Tunnel needs no published port at all (cloudflared
# talks to the container by name); set HIPPOCAMPUS_PUBLISH=8080 only when
# other machines must reach the backend directly.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hippocampus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hippocampus}
      POSTGRES_DB: hippocampus
    volumes:
      - ${HIPPOCAMPUS_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "${HIPPOCAMPUS_DB_PUBLISH:-127.0.0.1:5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hippocampus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Built by .github/workflows/release-backend.yml for every release, so
    # the machine running it never compiles anything. The default tag is
    # the release this file belongs to (scripts/bump-version.sh moves it
    # with every release), so a checkout of tag vX.Y.Z runs image X.Y.Z
    # and nothing changes until the checkout does. HIPPOCAMPUS_VERSION
    # overrides it, e.g. `latest` to follow every release. To build from
    # this checkout instead, add docker-compose.build.yml.
    image: ghcr.io/huulanka/hippocampus-backend:${HIPPOCAMPUS_VERSION:-1.19.3}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hippocampus:${POSTGRES_PASSWORD:-hippocampus}@postgres:5432/hippocampus
      BIND_ADDR: 0.0.0.0:8080
      MODEL_CACHE_DIR: /data/models
      # The archive of originals (ADR 0004). Without the volume below this
      # would be written inside the container and lost on the next
      # `--force-recreate`.
      AUDIO_DIR: /data/audio
      LOG_DIR: /data/logs
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # Zero Data Retention routing. Defaults to on inside the backend, so
      # leaving this unset is safe — it is here so that turning it *off*
      # is a deliberate, visible act rather than impossible.
      OPENROUTER_ZDR: ${OPENROUTER_ZDR:-}
      # Both or neither: the backend refuses to start with only one, and
      # warns loudly when neither is set that every request is trusted.
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ECHO_MIN_SIMILARITY: ${ECHO_MIN_SIMILARITY:-}
      HIPPOCAMPUS_RERANKER: ${HIPPOCAMPUS_RERANKER:-}
      ECHO_JUDGE_MODEL: ${ECHO_JUDGE_MODEL:-}
      ECHO_JUDGE_FALLBACK_MODEL: ${ECHO_JUDGE_FALLBACK_MODEL:-}
      ECHO_MIN_RERANK_SCORE: ${ECHO_MIN_RERANK_SCORE:-}
      HIPPOCAMPUS_TIMEZONE: ${HIPPOCAMPUS_TIMEZONE:-}
    volumes:
      - ${HIPPOCAMPUS_DATA_DIR:-./data}/models:/data/models
      - ${HIPPOCAMPUS_DATA_DIR:-./data}/audio:/data/audio
      - ${HIPPOCAMPUS_DATA_DIR:-./data}/logs:/data/logs
    ports:
      - "${HIPPOCAMPUS_PUBLISH:-127.0.0.1:8080}:8080"
