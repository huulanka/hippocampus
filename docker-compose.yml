# HIPPOCAMPUS_DATA_DIR: where the bind-mounted volumes below actually live
# on the host. Defaults to ./data (relative to this file), which is fine
# for local dev but not for a Portainer "deploy from Git repository" stack
# — Portainer clones the repo into its own managed stack directory, and
# ./data there is not a place a growing Postgres database, the audio
# archive, or the model cache should sit unattended. Point this at real,
# backed-up NAS storage instead (e.g. /volume1/docker/hippocampus/data on
# a Synology) via the stack's environment variables.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hippocampus
      POSTGRES_PASSWORD: hippocampus
      POSTGRES_DB: hippocampus
    volumes:
      - ${HIPPOCAMPUS_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hippocampus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Root, not ./backend: `backend` is a workspace member and needs its
      # siblings (root Cargo.toml/Cargo.lock, the `contracts` path
      # dependency) to build at all.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hippocampus:hippocampus@postgres:5432/hippocampus
      BIND_ADDR: 0.0.0.0:8080
      MODEL_CACHE_DIR: /data/models
      # The archive of originals (ADR 0004). Without the volume below this
      # would be written inside the container and lost on the next
      # `--force-recreate`.
      AUDIO_DIR: /data/audio
      LOG_DIR: /data/logs
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # Both or neither: the backend refuses to start with only one, and
      # warns loudly when neither is set that every request is trusted.
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ECHO_MIN_SIMILARITY: ${ECHO_MIN_SIMILARITY:-}
      HIPPOCAMPUS_RERANKER: ${HIPPOCAMPUS_RERANKER:-}
      ECHO_MIN_RERANK_SCORE: ${ECHO_MIN_RERANK_SCORE:-}
      HIPPOCAMPUS_TIMEZONE: ${HIPPOCAMPUS_TIMEZONE:-}
    volumes:
      - ${HIPPOCAMPUS_DATA_DIR:-./data}/models:/data/models
      - ${HIPPOCAMPUS_DATA_DIR:-./data}/audio:/data/audio
      - ${HIPPOCAMPUS_DATA_DIR:-./data}/logs:/data/logs
    ports:
      - "8080:8080"
