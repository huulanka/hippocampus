[package]
name = "backend"
version = "1.5.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
contracts = { version = "1.5.1", path = "../contracts" }
dotenvy = "0.15.7"
# Pure-Rust inference (no prebuilt ONNX Runtime binary) — see
# docs/adr/0008-candle-not-onnxruntime.md. The default (non-`mkl`/
# `accelerate`/`cuda`) CPU backend goes through the `gemm` crate, which
# does runtime CPU-feature detection rather than assuming AVX2 the way
# `ort`'s prebuilt binary did.
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
# default-features = false: same reasoning as reqwest below — avoid
# native-tls/openssl-sys, which is entirely absent from the Docker image.
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
tokenizers = "0.23.2"
# `rust_crypto` rather than `aws_lc_rs`: no C toolchain in the build, and
# without one of the two, verification panics at the first request.
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
pgvector = { version = "0.4.2", features = ["sqlx"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
# Throwaway RSA key pairs, so access verification is tested against real
# signatures instead of a key fixture committed to the repository.
base64 = "0.22"
rand = "0.8"
rsa = "0.9"
