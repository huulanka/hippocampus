[package]
name = "backend"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
contracts = { version = "1.0.0", path = "../contracts" }
dotenvy = "0.15.7"
# Default features pull in native-tls (both for downloading the ONNX
# Runtime binary and for Hugging Face model downloads), which drags in
# openssl-sys — fine on macOS where Homebrew's OpenSSL is already on the
# path, but the Docker build has no OpenSSL at all and everything else in
# this crate is deliberately rustls-only. Swap both to their rustls
# equivalents; `image-models` is kept as-is, it is unrelated to TLS.
fastembed = { version = "7.0.1", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
    "image-models",
] }
# `rust_crypto` rather than `aws_lc_rs`: no C toolchain in the build, and
# without one of the two, verification panics at the first request.
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
pgvector = { version = "0.4.2", features = ["sqlx"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
# Throwaway RSA key pairs, so access verification is tested against real
# signatures instead of a key fixture committed to the repository.
base64 = "0.22"
rand = "0.8"
rsa = "0.9"
